name: Pharmacy Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: pharmacy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-prod.txt
        pip install pytest pytest-odoo coverage
    
    - name: Run unit tests
      run: |
        python -m pytest tests/test_pharmacy_patient.py -v
        python -m pytest tests/test_pharmacy_claim.py -v
        python -m pytest tests/test_pharmacy_prescription.py -v
        python -m pytest tests/test_pharmacy_stock_lot.py -v
    
    - name: Run integration tests
      run: |
        python -m pytest tests/test_integration_pos.py -v
        python -m pytest tests/test_integration_dispensing.py -v
        python -m pytest tests/test_integration_insurance.py -v
    
    - name: Run performance tests
      run: |
        python -m pytest tests/test_performance.py -v
    
    - name: Generate coverage report
      run: |
        coverage run -m pytest tests/
        coverage report
        coverage xml
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
